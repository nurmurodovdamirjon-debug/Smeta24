version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smeta24_postgres
    restart: always
    environment:
      POSTGRES_USER: smeta_user
      POSTGRES_PASSWORD: smeta_secret_password
      POSTGRES_DB: smeta24_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smeta24_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: smeta24_backend
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://smeta_user:smeta_secret_password@postgres:5432/smeta24_db
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN:-placeholder_token}
    ports:
      - "8000:8000"

  webapp:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile
    container_name: smeta24_webapp
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
